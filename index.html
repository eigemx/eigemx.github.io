    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const htmlElement = document.documentElement;
            const pygmentsLink = document.createElement('link');
            pygmentsLink.rel = 'stylesheet';
            document.head.appendChild(pygmentsLink);

            // Function to get system preference
            const getSystemPreference = () => {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    return 'dark';
                }
                return 'light';
            };

            // Use saved theme or system preference
            const theme = savedTheme || getSystemPreference();

            if (theme === 'light') {
                htmlElement.classList.remove('dark-mode');
                pygmentsLink.href = 'static/css/pygments-rose-pine-dawn.css';
            } else {
                htmlElement.classList.add('dark-mode');
                pygmentsLink.href = 'static/css/pygments-rose-pine.css';
            }
        })();
    </script>
